# Publishes to GitHub Pages:
# - the landing page, prerendered to static HTML for each language:
#   https://yaroslavyushchenko.github.io/inkboard/ (English) and .../inkboard/uk/ (Ukrainian)
# - the web app (the same app as the desktop one, boards kept in the browser): .../inkboard/app/
# Download buttons read the latest release from the GitHub API, so a new release needs no redeploy.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'apps/web/**', 'src/**', 'packages/**', 'scripts/prerender-site.mjs', 'site.vite.config.mts', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:site
      - run: npm run build:web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v5
