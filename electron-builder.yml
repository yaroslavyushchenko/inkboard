appId: app.inkboard.desktop
productName: Inkboard
copyright: Copyright © 2026 Yaroslav Yushchenko and contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

fileAssociations:
  - ext: inkboard
    name: Inkboard board
    description: Inkboard whiteboard
    mimeType: application/x-inkboard
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [universal]
  # No Apple Developer certificate yet: ad-hoc signature so Apple Silicon Macs can run it.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  # Window background with first-launch steps: build/background.png (+ @2x), made from
  # build/dmg-background.html. Icon positions match the drawing.
  iconSize: 96
  contents:
    - x: 170
      y: 170
    - x: 490
      y: 170
      type: link
      path: /Applications

linux:
  target: [AppImage, deb]
  syncDesktopName: true
  category: Education
  maintainer: Yaroslav Yushchenko <contact@yaroslavyushchenko.com>
  synopsis: Free whiteboard for teachers with a pen tablet
  description: >-
    Inkboard is an infinite whiteboard for writing and drawing with a pen tablet.
    It has pressure-sensitive vector ink, a protractor and a compass, shapes,
    pyramids and prisms, number lines, coordinate planes and formatted text.
    Every board saves itself within seconds, so nothing is lost even if the power
    goes out. Works offline, needs no account. English and Ukrainian interface.

# Static AppImage runtime: runs on Ubuntu 22.04+ without installing libfuse2.
toolsets:
  appimage: '1.0.3'

# Auto-update feed: electron-updater reads latest*.yml from GitHub Releases.
publish:
  provider: github
  owner: yaroslavyushchenko
  repo: inkboard
