# Asks every outside contributor to sign CLA.md once, by posting a comment on their pull request.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch, which must exist
# before the first outside pull request: git push origin main:cla-signatures
# To block merging until the CLA is signed, mark the "CLA" check as required for `main`
# (Settings > Branches > Branch protection rules).
#
# pull_request_target runs this workflow from `main`, never from the contributor's code, so the
# write permissions below never reach code from a pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/yaroslavyushchenko/inkboard/blob/main/CLA.md
          branch: cla-signatures
          allowlist: yaroslavyushchenko,*[bot]
          lock-pullrequest-aftermerge: false
