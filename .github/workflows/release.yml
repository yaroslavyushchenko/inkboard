name: Release

# Push a tag like v0.1.0 to build installers for every OS and publish a GitHub Release.
# "Run workflow" by hand builds the installers as downloadable artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Linux build also makes the snap, which needs snapcraft and an LXD container. Both come
      # from the Snap Store; when it is down, the release still ships the AppImage and .deb.
      - name: Set up LXD for snapcraft
        id: lxd
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: canonical/setup-lxd@v1
      # snapcraft 9 looks for the desktop file before copying snap/gui into the snap, which
      # breaks electron-builder 26's core24 snaps; 8.x builds them fine.
      - name: Install snapcraft
        id: snapcraft
        if: runner.os == 'Linux' && steps.lxd.outcome == 'success'
        continue-on-error: true
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Package
        shell: bash
        run: |
          targets="${{ matrix.target }}"
          if [ "$RUNNER_OS" = Linux ] && [ "${{ steps.snapcraft.outcome }}" != success ]; then
            echo "::warning::Snap Store unreachable, building AppImage and .deb without the snap."
            targets="--linux AppImage deb"
          fi
          npx electron-builder $targets --publish never
        env:
          # Don't try to find signing certificates on CI (none configured yet).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: snap
          if-no-files-found: warn
          path: dist/*.snap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Inkboard $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --latest

  # Upload the snap to the Snap Store (stable channel), which is what Ubuntu App Center shows.
  # Skipped until the SNAPCRAFT_STORE_CREDENTIALS secret is added (see docs/SNAP.md).
  snap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Check for store credentials
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set, skipping the Snap Store upload. See docs/SNAP.md."
      - uses: actions/download-artifact@v8
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: snap
          path: snap
      - name: Install snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: sudo snap install snapcraft --classic
      - name: Upload to the Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          for f in snap/*.snap; do
            snapcraft upload "$f" --release=stable
          done
