name: Release

# Push a tag like v0.1.0 to build installers for every OS and publish a GitHub Release.
# "Run workflow" by hand builds the installers as downloadable artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Linux build also makes the snap, which needs snapcraft and an LXD container.
      # Use 5.21/stable (LTS) and retry snap installs in case api.snapcraft.io drops a connection.
      - name: Set up LXD and snapcraft
        if: runner.os == 'Linux'
        run: |
          retry_snap() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "Attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            return 1
          }
          if snap list lxd 2>/dev/null; then
            retry_snap sudo snap refresh lxd --channel=5.21/stable
          else
            retry_snap sudo snap install lxd --channel=5.21/stable
          fi
          while [ -n "$(snap changes lxd 2>/dev/null | awk '/^[0-9]+/ {if ($2 != "Done") print $2 }')" ]; do
            sleep 1
          done
          sudo snap set lxd daemon.group=adm
          sudo lxd waitready
          sudo lxd init --auto
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT || true
          sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
          sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT || true
          sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
          # snapcraft 9 looks for the desktop file before copying snap/gui into the snap, which
          # breaks electron-builder 26's core24 snaps; 8.x builds them fine.
          retry_snap sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Don't try to find signing certificates on CI (none configured yet).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: snap
          if-no-files-found: error
          path: dist/*.snap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Inkboard $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --latest

  # Upload the snap to the Snap Store (stable channel), which is what Ubuntu App Center shows.
  # Skipped until the SNAPCRAFT_STORE_CREDENTIALS secret is added (see docs/SNAP.md).
  snap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Check for store credentials
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set, skipping the Snap Store upload. See docs/SNAP.md."
      - uses: actions/download-artifact@v8
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: snap
          path: snap
      - name: Install snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo snap install snapcraft --classic --channel=8.x/stable; then break; fi
            sleep 10
          done
      - name: Upload to the Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          for f in snap/*.snap; do
            snapcraft upload "$f" --release=stable
          done
