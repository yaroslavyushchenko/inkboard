appId: app.inkboard.desktop
productName: Inkboard
copyright: Copyright © 2026 Yaroslav Yushchenko and contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

fileAssociations:
  - ext: inkboard
    name: Inkboard board
    description: Inkboard whiteboard
    mimeType: application/x-inkboard
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [universal]
  # No Apple Developer certificate yet: ad-hoc signature so Apple Silicon Macs can run it.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  # Window background with first-launch steps: build/background.png (+ @2x), made from
  # build/dmg-background.html. Icon positions match the drawing.
  iconSize: 96
  contents:
    - x: 170
      y: 170
    - x: 490
      y: 170
      type: link
      path: /Applications

linux:
  target: [AppImage, deb, snap]
  syncDesktopName: true
  category: Education
  maintainer: Yaroslav Yushchenko <contact@yaroslavyushchenko.com>
  synopsis: Free whiteboard for teachers with a pen tablet
  description: >-
    Inkboard is an infinite whiteboard for writing and drawing with a pen tablet.
    It has pressure-sensitive vector ink, a protractor and a compass, shapes,
    pyramids and prisms, number lines, coordinate planes and formatted text.
    Every board saves itself within seconds, so nothing is lost even if the power
    goes out. Works offline, needs no account. English and Ukrainian interface.

# Snap for the Snap Store / Ubuntu App Center (see docs/SNAP.md).
# Strict confinement: pen input arrives through the normal Wayland/X11 plugs, and file
# dialogs go through the XDG desktop portal (the gnome extension enables it), so the
# app can open and save files anywhere the user picks, not only in the home folder.
# License, screenshots and links are not part of the snap: they are set once on the
# store listing page (electron-builder's core24 target has no fields for them).
snapcraft:
  base: core24
  core24:
    confinement: strict
    grade: stable
    summary: Free infinite whiteboard for teachers with a pen tablet
    title: Inkboard
    # The gnome extension adds the GNOME runtime, themes and the desktop/wayland/x11/opengl
    # plugs; listing them here too keeps the intent explicit. browser-support is needed
    # by Electron itself (electron-builder only adds it when no plugs are given).
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home
      - removable-media
      - network
      - browser-support

# Static AppImage runtime: runs on Ubuntu 22.04+ without installing libfuse2.
toolsets:
  appimage: '1.0.3'

# Auto-update feed: electron-updater reads latest*.yml from GitHub Releases.
publish:
  provider: github
  owner: yaroslavyushchenko
  repo: inkboard
